spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/postgres
    username: postgres
    password: admin
    driver-class-name: org.postgresql.Driver
  liquibase:
    enabled: ${LIQUIBASE_ENABLED:true}

app:
  jwt:
    secret: ${JWT_SECRET:change-me-in-production-use-at-least-32-characters}
    access-expiration-ms: 900000
    refresh-expiration-ms: 604800000
  mail:
    enabled: false
  file:
    upload-dir: ${FILE_UPLOAD_DIR:./uploads}
  seed:
    system-admin-password: ${SYSTEM_ADMIN_PASSWORD:Admin123!}
  user:
    reset-password: ${USER_RESET_PASSWORD:Admin123!}

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    default-executor-type: reuse
    # SLF4J로 SQL 출력 (logger 레벨은 아래 logging.level 참고)
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

# MyBatis mapper namespace(= Repository FQCN) DEBUG 시 SQL/파라미터 출력
logging:
  level:
    com.miniproject.user.domain: DEBUG
    com.miniproject.role.domain: DEBUG
    com.miniproject.menu.domain: DEBUG
    com.miniproject.i18n.domain: DEBUG
    com.miniproject.auth.domain: DEBUG
    com.miniproject.settings.domain: DEBUG
    com.miniproject.mail.domain: DEBUG
    com.miniproject.file.domain: DEBUG
    com.miniproject.demo.domain: DEBUG

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

