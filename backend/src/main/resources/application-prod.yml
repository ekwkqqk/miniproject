spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  liquibase:
    enabled: ${LIQUIBASE_ENABLED:true}
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    default-executor-type: reuse

# 운영 환경에서는 Swagger / OpenAPI 문서 비활성화
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

# 메트릭 엔드포인트는 네트워크 격리(사설망/방화벽) 전제를 권장합니다.
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus

app:
  mail:
    enabled: ${MAIL_ENABLED:true}
  file:
    upload-dir: ${FILE_UPLOAD_DIR:/var/miniproject/uploads}
