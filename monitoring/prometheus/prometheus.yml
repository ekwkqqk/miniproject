global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: miniproject-backend
    metrics_path: /actuator/prometheus
    scrape_interval: 10s
    static_configs:
      # Spring Boot on host machine (Docker Desktop / Linux with host-gateway)
      - targets: ["host.docker.internal:8080"]
        labels:
          application: miniproject
          env: local
